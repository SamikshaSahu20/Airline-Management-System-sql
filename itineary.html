<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Itinerary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Passenger Information</h2>
        <table class="passenger-table">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Address</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Pincode</th>
                    <th>Country</th>
                </tr>
            </thead>
                    </table>
    </div>
</body><style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
}

.container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h2 {
    text-align: center;
}

.passenger-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

.passenger-table th, .passenger-table td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.passenger-table th {
    background-color: #f2f2f2;
    font-weight: bold;
}
</style>
</html>
