    background-color: #007bff; /* Blue button background color */

<body>
<form id="passengerForm" method="post" action="passenger.php">
<div class="container">
    <form id="passengerForm">
    <div id="passengerCount">
      <label for="passengerCountInput">Number of Passengers:</label>
      <input type="number" id="passengerCountInput" name="passengerCount" min="1" required>
      <button type="button" onclick="generatePassengerFields()">Generate Fields</button>
    </div>
  </form>
</div>

<script>
function generatePassengerFields() {
  var passengerCount = document.getElementById('passengerCountInput').value;
  var passengerForm = document.getElementById('passengerForm');
  // Clear previous fields if any
  passengerForm.innerHTML = '<h2>Passenger Information</h2>';
  // Generate input fields for each passenger
  for (var i = 1; i <= passengerCount; i++) {
    var div = document.createElement('div');
    div.className = 'passenger';
    div.innerHTML = `
      <h3>Passenger ${i}</h3>
      <label for="firstName${i}">First Name:</label>
      <input type="text" id="firstName${i}" name="firstName${i}" required><br>
      <label for="lastName${i}">Last Name:</label>
      <input type="text" id="lastName${i}" name="lastName${i}" required><br>
      <label for="age${i}">Age:</label>
      <input type="text" id="age${i}" name="age${i}" required><br>
      <label for="gender${i}">Gender:</label>
      <input type="text" id="gender${i}" name="gender${i}" required><br>
      <label for="email${i}">Email:</label>
      <input type="email" id="email${i}" name="email${i}" required><br>
      <label for="mobile${i}">Mobile Number:</label>
      <input type="text" id="mobile${i}" name="mobile${i}" required><br>
      <label for="address${i}">Address:</label>
      <input type="text" id="address${i}" name="address${i}" required><br>
      <label for="city${i}">City:</label>
      <input type="text" id="city${i}" name="city${i}" required><br>
      <label for="state${i}">State:</label>
      <input type="text" id="state${i}" name="state${i}" required><br>
      <label for="pincode${i}">Pincode:</label>
      <input type="text" id="pincode${i}" name="pincode${i}" required><br>
      <label for="country${i}">Country:</label>
      <input type="text" id="country${i}" name="country${i}" required><br><br>`;
    passengerForm.appendChild(div);
  }
  // Add submit button
  var submitButton = document.createElement('button');
  submitButton.type = 'submit';
  submitButton.textContent = 'Submit';
  passengerForm.appendChild(submitButton);
  
  // Add event listener to submit button
  submitButton.addEventListener('click', function() {
    // Redirect to itinerary.html
    window.location.href = 'details.php';
  });
}
</script>
